version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: training-postgres
    environment:
      POSTGRES_DB: training_event_db
      POSTGRES_USER: training_user
      POSTGRES_PASSWORD: training_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training_user -d training_event_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Performance optimizations for development
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]

volumes:
  postgres_data:
