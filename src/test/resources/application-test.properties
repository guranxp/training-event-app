# Test database configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable JPA Web Support
spring.jpa.open-in-view=false

# Disable JTA
spring.jta.enabled=false

# Disable startup validation (for H2 in-memory DB)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Disable batch processing (not needed for H2 in-memory)
spring.jpa.properties.hibernate.jdbc.batch_size=0

# Disable H2 console for tests
spring.h2.console.enabled=false

# Test logging configuration - suppress verbose output
logging.level.root=ERROR
logging.level.com.guranxp=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
